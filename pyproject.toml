[project]
name = "ecommerce-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "amityedage371@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "streamlit>=1.65.0",
]

[project.scripts]
ecommerce-dashboard = "ecommerce_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

